name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/DrmcPatientPortal/DrmcPatientPortal.csproj
      - name: Build
        run: dotnet build src/DrmcPatientPortal/DrmcPatientPortal.csproj -c Release --no-restore -warnaserror
      - name: Publish
        run: dotnet publish src/DrmcPatientPortal/DrmcPatientPortal.csproj -c Release --no-build --no-restore -o "${{ runner.temp }}/drmc-publish" -warnaserror
