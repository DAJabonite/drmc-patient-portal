name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      SA_PASSWORD: Ci#Throwaway-${{ github.run_id }}
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci#Throwaway-${{ github.run_id }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DrmcPatientPortal.slnx
      - name: Build
        run: dotnet build DrmcPatientPortal.slnx -c Release --no-restore -warnaserror
      - name: Check for missing migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          dotnet ef migrations has-pending-model-changes --project src/DrmcPatientPortal --configuration Release --no-build
        env:
          ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=ModelCheck;User Id=sa;Password=${{ env.SA_PASSWORD }};Encrypt=True;TrustServerCertificate=True
      - name: Test
        run: dotnet test DrmcPatientPortal.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"
        env:
          DRMC_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=${{ env.SA_PASSWORD }};Encrypt=True;TrustServerCertificate=True
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
